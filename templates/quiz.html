<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wellness Assessment - MindHaven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
        }

        .quiz-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .form-label {
            font-weight: 500;
            color: #26a69a;
        }

        .range-wrap {
            position: relative;
            margin-bottom: 30px;
        }

        #google_translate_element {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-size: 14px;
        }

        .goog-te-gadget img {
            display: none;
            /* Hide Google branding flag icon */
        }

        .navbar {
            padding-top: 50px;
        }
    </style>
</head>
<!-- Google Translate Widget -->
<div id="google_translate_element"></div>
<!-- Google Translate Script -->
<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,bn,hi,ar,fr,es', // Customize this list
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card quiz-card p-5">
                    <h2 class="text-center mb-4" style="color: #26a69a;">Let's Get to Know You</h2>
                    <p class="text-center text-muted mb-5">Fill in your details and answer 4 quick questions to get
                        matched with your ideal therapist.</p>

                    <form method="POST" action="{{ url_for('take_quiz') }}">

                        <h5 class="mb-3 border-bottom pb-2">1. Your Profile</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="full_name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contact Number</label>
                                <input type="text" name="contact" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Location</label>
                                <input type="text" name="location" class="form-control" placeholder="City, Country"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Qualification/Occupation</label>
                                <input type="text" name="qualification" class="form-control">
                            </div>
                        </div>

                        <h5 class="mb-3 border-bottom pb-2 mt-5">2. Wellness Check</h5>
                        <p class="text-muted small">Rate the following on a scale of 1 (Not at all) to 5 (Very much)</p>

                        <div class="mb-4">
                            <label class="form-label">Q1. How often do you feel overwhelmed or stressed?</label>
                            <input type="range" class="form-range" min="1" max="5" name="q1" id="q1">
                            <div class="d-flex justify-content-between small text-muted">
                                <span>Never</span><span>Constantly</span></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Q2. How would you rate your sleep quality lately?</label>
                            <input type="range" class="form-range" min="1" max="5" name="q2" id="q2">
                            <div class="d-flex justify-content-between small text-muted">
                                <span>Great</span><span>Terrible</span></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Q3. Do you feel anxious or on edge?</label>
                            <input type="range" class="form-range" min="1" max="5" name="q3" id="q3">
                            <div class="d-flex justify-content-between small text-muted">
                                <span>Never</span><span>Always</span></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Q4. Have you lost interest in things you used to enjoy?</label>
                            <input type="range" class="form-range" min="1" max="5" name="q4" id="q4">
                            <div class="d-flex justify-content-between small text-muted"><span>No</span><span>Yes,
                                    completely</span></div>
                        </div>

                        <div class="text-center mt-5">
                            <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill"
                                style="background-color: #26a69a; border: none;">Find My Match</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
