<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Therapist Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f8ff; font-family: 'Poppins', sans-serif; }
        .dashboard-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white px-4">
        <a class="navbar-brand fw-bold" style="color:#26a69a;">MindHaven for Professionals</a>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </nav>

    <div class="container mt-5">
        <h1>Welcome, Dr. {{ current_user.name }}</h1>
        <p class="text-muted">Manage your appointments and patients here.</p>

        <div class="row mt-4">
            <div class="col-md-4">
                <div class="dashboard-card text-center">
                    <h3 style="color:#26a69a;">5</h3>
                    <p>Upcoming Sessions</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="dashboard-card text-center">
                    <h3 style="color:#26a69a;">12</h3>
                    <p>Total Patients</p>
                </div>
            </div>
        </div>
        
        <div class="mt-5">
            <h4>Today's Schedule</h4>
            <div class="card p-3 mt-3 border-0 shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="m-0">Session with Rahul</h5>
                        <small class="text-muted">10:00 AM - 11:00 AM</small>
                    </div>
                    <button class="btn btn-primary btn-sm" style="background-color:#26a69a; border:none;">Join Video</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
