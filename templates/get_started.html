<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - MindHaven</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #f0f8ff 100%);
            /* Your theme gradient */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .btn-teal {
            background-color: #26a69a;
            /* Your Primary Teal */
            color: white;
            font-weight: 600;
            border-radius: 50px;
            padding: 10px 0;
            transition: all 0.3s ease;
        }

        .btn-teal:hover {
            background-color: #4db6ac;
            color: white;
            transform: translateY(-2px);
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            background-color: #f8f9fa;
            border: 1px solid #eee;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #26a69a;
        }

        h2 {
            color: #26a69a;
        }

        a {
            color: #26a69a;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            color: #4db6ac;
        }

        #google_translate_element {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-size: 14px;
        }

        .goog-te-gadget img {
            display: none;
            /* Hide Google branding flag icon */
        }

        .navbar {
            padding-top: 50px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-5">
                    <div class="text-center mb-4">
                        <h2>Create Account</h2>
                        <p class="text-muted">Join MindHaven today</p>
                    </div>

                    <form method="POST" action="{{ url_for('get_started') }}">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Choose a username"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted small">Password</label>
                            <input type="password" name="password" class="form-control"
                                placeholder="Create a strong password" required>
                        </div>

                        <button type="submit" class="btn btn-teal w-100 mb-3">Sign Up</button>
                    </form>
                    <div class="text-center mt-3">
                        <p class="small">Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
                        <hr>
                        <a href="/" class="small text-muted">← Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Google Translate Widget -->
    <div id="google_translate_element"></div>
    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,bn,hi,ar,fr,es', // Customize this list
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>

</html>
